unresolved_authority_questions:
  - Meaning and signedness of the final 8 argument in historical Malloc_Weight calls.
  - FPGA internal activation dtype for Conv, SiLU, Add, Concat, Resize, and MaxPool.
  - Accumulator width and overflow behavior.
  - Exact per-channel scale layout and application point.
  - Origin and hardware interpretation of batchnorm scale_times_1000.
  - Exact lane position for the single Gray1 channel in a 32-lane input block.
  - Complete physical shape rules for C2f and C2 branches before concatenation.
  - Production RTL and driver version implementing 31 valid output channels plus padding.

