schema: pose21-gray1-fpga-contract/v1
document_status: draft
updated_at: "2026-09-23"
purpose: >-
  Machine-readable companion to the Pose21 Gray1 architecture and FPGA
  migration document. Fields marked unresolved must not be treated as a
  production hardware contract.

status_vocabulary:
  verified: Confirmed from the current model, artifact, or implementation.
  historical: Evidence belongs only to the old WRS/PPT or R-only model.
  provisional: Used by current software without completed FPGA validation.
  inferred: Derived from multiple observations but not confirmed by the authority.
  unresolved: Missing an authoritative definition or validation.

